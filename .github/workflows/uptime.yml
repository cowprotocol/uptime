name: Uptime CI
on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [uptime]
  workflow_dispatch:
jobs:
  release:
    name: Check status
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ github.token }}
      - name: Verify alert credentials are wired up
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.NOTIFICATION_SLACK_WEBHOOK_URL }}
          TELEGRAM_BOT_KEY: ${{ secrets.NOTIFICATION_TELEGRAM_BOT_KEY }}
          TELEGRAM_CHAT_ID: ${{ secrets.NOTIFICATION_TELEGRAM_CHAT_ID }}
        run: |
          missing=""
          if [ -z "$SLACK_WEBHOOK_URL" ]; then missing="$missing NOTIFICATION_SLACK_WEBHOOK_URL"; fi
          if [ -z "$TELEGRAM_BOT_KEY" ]; then missing="$missing NOTIFICATION_TELEGRAM_BOT_KEY"; fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then missing="$missing NOTIFICATION_TELEGRAM_CHAT_ID"; fi
          if [ -n "$missing" ]; then
            echo "::error::missing secrets:$missing - downtime alerts are disabled"
            exit 1
          fi
      - name: Check endpoint status
        uses: upptime/uptime-monitor@65aad8bba77c40ec051f30e7329563f7f4cfab6e # v1.43.9
        with:
          command: "update"
        env:
          GH_PAT: ${{ github.token }}
          NOTIFICATION_SLACK: "true"
          NOTIFICATION_SLACK_WEBHOOK_URL: ${{ secrets.NOTIFICATION_SLACK_WEBHOOK_URL }}
          NOTIFICATION_TELEGRAM: "true"
          NOTIFICATION_TELEGRAM_BOT_KEY: ${{ secrets.NOTIFICATION_TELEGRAM_BOT_KEY }}
          NOTIFICATION_TELEGRAM_CHAT_ID: ${{ secrets.NOTIFICATION_TELEGRAM_CHAT_ID }}
